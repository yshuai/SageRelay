name: Deploy to GitHub Pages

# 当前 Pages 源为 gh-pages 分支（legacy 构建），本工作流仅手动触发备用。
# 若要切回 Actions 部署：仓库 Settings → Pages → Source 选 GitHub Actions，
# 并把下方 trigger 恢复为 push: branches: [main]。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 项目页（username.github.io/<repo>）需要子路径 base；用户主页仓库（username.github.io）请把下面改为 VP_BASE=/
      - name: Compute VitePress base
        run: echo "VP_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          VP_BASE: ${{ env.VP_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
